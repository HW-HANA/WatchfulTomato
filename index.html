<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efdf" />
    <meta name="description" content="一双会盯着你的大眼睛，陪你完成一个番茄钟。" />
    <title>盯一下 · 鼠标监视番茄钟</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="topbar">
        <a class="brand" id="brand" href="#timer" aria-label="盯一下首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>盯一下</span>
        </a>
        <p class="tiny-status" id="tiny-status"><span class="status-dot"></span>正在待命</p>
      </header>

      <section class="hero" id="timer">
        <div class="copy-block">
          <p class="eyebrow">WATCHFUL TOMATO</p>
          <h1 id="app-title">你专心，<br /><span>我盯着。</span></h1>
          <p class="intro"><span class="intro-normal">可爱的大眼睛番茄。开始一个番茄钟，它会一直陪着你。</span><span class="intro-horror" aria-hidden="true">一直一直一直一直一直一直一直一直一直一直一直看着你</span></p>
        </div>

        <div class="watcher-wrap" id="watcher-wrap">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="watcher" id="watcher">
            <div class="brow brow-left"></div>
            <div class="brow brow-right"></div>
            <div class="eye eye-left"><div class="pupil"><div class="glint"></div></div></div>
            <div class="eye eye-right"><div class="pupil"><div class="glint"></div></div></div>
            <canvas id="tear-canvas" class="tear-canvas" aria-hidden="true"></canvas>
            <div class="mouth"></div>
            <button class="pet-zone head-zone" id="pet-head" type="button" aria-label="摸摸番茄头顶"></button>
            <button class="pet-zone cheek-zone cheek-left" data-cheek="left" type="button" aria-label="戳戳番茄左脸"></button>
            <button class="pet-zone cheek-zone cheek-right" data-cheek="right" type="button" aria-label="戳戳番茄右脸"></button>
          </div>
          <p class="gaze-note" id="gaze-note">摸摸头顶，也可以戳戳脸</p>
        </div>

        <section class="timer-card" aria-label="番茄钟控制">
          <div class="mode-switch" role="group" aria-label="计时模式">
            <button class="mode active" data-minutes="25" data-mode="focus" type="button">专注 <span>25</span></button>
            <button class="mode" data-minutes="5" data-mode="rest" type="button">休息 <span>05</span></button>
          </div>

          <label class="task-field" id="task-field">
            <span>这轮盯什么</span>
            <input id="task-input" type="text" maxlength="40" autocomplete="off" placeholder="选填，例如：画完小鸡三视图" />
          </label>

          <div class="timer-display" aria-live="polite" aria-atomic="true">
            <span id="minutes">25</span><span class="colon">:</span><span id="seconds">00</span>
          </div>
          <p class="timer-caption" id="timer-caption">准备好了就开始，我会看着你。</p>

          <div class="controls">
            <button class="icon-button" id="reset-button" type="button" aria-label="重置计时器" title="重置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.9 7.5A8 8 0 1 1 4 12M4 5v4h4" /></svg>
            </button>
            <div class="primary-wrap">
              <button class="primary-button" id="toggle-button" type="button">
                <span class="play-icon" aria-hidden="true"></span>
                <span id="toggle-label">开始专注</span>
              </button>
              <span class="button-vine" aria-hidden="true"></span>
              <span class="button-tomato" aria-hidden="true"><i></i></span>
            </div>
            <button class="icon-button sound-on" id="sound-button" type="button" aria-label="关闭结束提示音" title="提示音">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Zm12.5.5a4 4 0 0 1 0 5m2-7a7 7 0 0 1 0 9" /></svg>
            </button>
          </div>

          <label class="drama-switch">
            <input id="drama-toggle" type="checkbox" checked />
            <span class="switch-track"><span></span></span>
            <span><strong>戏精监工</strong><small id="drama-copy">会流番茄汁，但不会真的拦你</small></span>
          </label>

          <button class="hydrate-button" id="hydrate-button" type="button" hidden>
            <span class="glass-icon" aria-hidden="true"><i></i></span>
            <span><strong>我喝水了</strong><small>让番茄汁退潮一点</small></span>
          </button>

          <button class="sensor-button" id="sensor-button" type="button" hidden>
            <span class="sensor-icon" aria-hidden="true"></span>
            允许视线跟随
          </button>
          <p class="sensor-message" id="sensor-message" role="status" hidden></p>

          <div class="completion-card" id="completion-card" hidden>
            <span class="completion-seal">完成</span>
            <p>本轮任务</p>
            <strong id="completion-task">认真专注一会儿</strong>
          </div>
        </section>
      </section>

      <footer>
        <p>已完成 <span id="session-count">0</span> 个番茄</p>
        <p class="shortcut">空格 开始 / 暂停&nbsp;&nbsp; R 重置</p>
      </footer>
    </main>
    <div class="water-scene" id="water-scene" aria-hidden="true">
      <div class="water-surface">
        <span class="wave wave-one"></span>
        <span class="wave wave-two"></span>
      </div>
      <span class="bubble bubble-one"></span>
      <span class="bubble bubble-two"></span>
      <span class="bubble bubble-three"></span>
      <span class="float-tomato float-one"><i></i></span>
      <span class="float-tomato float-two"><i></i></span>
    </div>
    <div class="edge-peeker" id="edge-peeker" aria-hidden="true">
      <span class="peeker-eye left"></span><span class="peeker-eye right"></span>
      <span class="peeker-copy">抓到你了</span>
    </div>
    <div class="return-overlay" id="return-overlay" aria-hidden="true">
      <div class="return-face"><span></span><span></span></div>
      <p id="return-copy">你刚才去哪里了？</p>
    </div>
    <div class="horror-overlay" id="horror-overlay" aria-hidden="true"><p id="horror-copy">你离开时，我也一直看着。</p></div>
    <canvas id="fountain-canvas" class="fountain-canvas" aria-hidden="true"></canvas>
    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <aside class="studio-panel" id="studio-panel" aria-label="导演模式" hidden>
      <div class="studio-head"><strong>🎬 导演模式</strong><button id="studio-collapse" type="button" aria-label="收起导演模式">−</button></div>
      <div class="studio-body">
        <label>番茄汁水位 <output id="studio-water-output">0%</output><input id="studio-water" type="range" min="0" max="100" value="0" /></label>
        <div class="studio-actions">
          <button type="button" data-studio-action="tear">暂停流泪</button>
          <button type="button" data-studio-action="drink">喝水退潮</button>
          <button type="button" data-studio-action="return">离开返回</button>
          <button type="button" data-studio-action="horror">恐怖彩蛋</button>
          <button type="button" data-studio-action="celebrate">完成喷泉</button>
          <button type="button" data-studio-action="reset">恢复正常</button>
        </div>
      </div>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
